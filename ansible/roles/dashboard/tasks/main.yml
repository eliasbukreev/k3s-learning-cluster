---
# tasks file for roles/dashboard

- name: Deploy kubernetes-dashboard chart
  kubernetes.core.helm:
    name: "{{ dashboard_release_name }}"
    namespace: "{{ dashboard_namespace }}"
    chart_repo_url: https://kubernetes-retired.github.io/dashboard
    chart_ref: kubernetes-dashboard
    chart_version: "{{ dashboard_chart_version }}"
    create_namespace: true
    values_files:
      - "{{ role_path }}/files/values.yaml"
  delegate_to: localhost
  become: false
  register: helm_deploy
  retries: 3
  delay: 30
  until: helm_deploy is succeeded

- name: Apply dashboard admin RBAC and token secret
  kubernetes.core.k8s:
    src: "{{ role_path }}/files/dashboard-admin.yaml"
    state: present
  delegate_to: localhost
  become: false

- name: Read kong proxy service
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    name: "{{ dashboard_release_name }}-kong-proxy"
    namespace: "{{ dashboard_namespace }}"
  register: dashboard_proxy_svc
  delegate_to: localhost
  become: false
  retries: 10
  delay: 5
  until: dashboard_proxy_svc.resources | length > 0

- name: Read admin token from secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: admin-user-token
    namespace: "{{ dashboard_namespace }}"
  register: dashboard_token_secret
  delegate_to: localhost
  become: false
  retries: 10
  delay: 5
  until: >-
    dashboard_token_secret.resources | length > 0
    and dashboard_token_secret.resources[0].data.token is defined

- name: Show dashboard access info
  ansible.builtin.debug:
    msg:
      - "Dashboard URL: https://{{ ansible_host }}:{{ dashboard_proxy_svc.resources[0].spec.ports[0].nodePort }}"
      - "Token: {{ dashboard_token_secret.resources[0].data.token | b64decode }}"
